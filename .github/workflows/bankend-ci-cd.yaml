name: Backend iMusic CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  AZURE_WEBAPP_NAME: iMusic
  AZURE_WEBAPP_PACKAGE_PATH: './iMusic.API/publish'
  DOTNET_VERSION: '8.0'
  SOLUTION_PATH: 'iMusic.sln'
  API_PROJECT_PATH: 'iMusic.API'
  PUBLISH_DIR: './publish'
  BUILD_VERSION: '0.1.${{ github.run_number }}'

jobs:
  build-and-test:
    name: Build, Test, Lint, Coverage, and Report
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set Build Version
        run: |
          if [[ -n "${{ github.event.inputs.build_version }}" ]]; then
            echo "BUILD_VERSION=${{ github.event.inputs.build_version }}" >> $GITHUB_ENV
          else
            echo "BUILD_VERSION=${{ env.BUILD_VERSION }}" >> $GITHUB_ENV
          fi

      - name: Restore Dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Run Code Linters
        run: dotnet tool install -g dotnet-format && dotnet format ${{ env.SOLUTION_PATH }} --verify-no-changes
        continue-on-error: true # Allow CI to proceed even if linter fails

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }}
          --configuration Release
          --no-restore
          /p:Version=${{ env.BUILD_VERSION }} # Use /p: to set the Version property

      - name: Run Tests and Collect Code Coverage
        run: dotnet test ${{ env.SOLUTION_PATH }}
          --configuration Release
          --no-restore
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory TestResults
          --logger:"VSTest" # Додано logger VSTest
        working-directory: ${{ github.workspace }}

      - name: Generate Code Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report-${{ env.BUILD_VERSION }}
          path: ${{ github.workspace }}/TestResults/*/coverage.cobertura.xml

      - name: Publish
        run: dotnet publish ${{ env.API_PROJECT_PATH }}
          --configuration Release
          --no-restore
          --no-build
          --output ${{ env.PUBLISH_DIR }}
          /p:Version=${{ env.BUILD_VERSION }}

      - name: Debug List Files in TestResults Subdirectories
        run: ls -R ${{ github.workspace }}/TestResults

      - name: Debug Check for TRX files in subdirectories
        run: find ${{ github.workspace }}/TestResults -name "*.trx" -print

      - name: Debug Check for TRX files in subdirectories11
        run: find ${{ github.workspace }}/TestResults/
        
      - name: Generate Build Report
        run: |
          echo "## Build Report - ${{ env.BUILD_VERSION }}" >> build-report.md
          echo "- Commit: ${{ github.sha }}" >> build-report.md
          echo "- Branch: ${{ github.ref_name }}" >> build-report.md
          echo "- Build Number: ${{ github.run_number }}" >> build-report.md
          echo "- Build Status: Success (Linter may have reported issues)" >> build-report.md
          echo "### Tests Results:" >> build-report.md
          TEST_RESULTS=$(ls ${{ github.workspace }}/TestResults/*/*.trx)
          if [[ -n "$TEST_RESULTS" ]]; then
            ls ${{ github.workspace }}/TestResults/*.trx | xargs -I {} bash -c 'echo "```xml"; cat "{}"; echo "```"' >> build-report.md
          else
            echo "No test results found." >> build-report.md
          fi
          echo "### Code Coverage Report:" >> build-report.md
          echo "Link to Code Coverage Artifact: [code-coverage-report-${{ env.BUILD_VERSION }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/code-coverage-report-${{ env.BUILD_VERSION }})" >> build-report.md
          echo "### Linter Report:" >> build-report.md
          echo "Please review the workflow output for potential linter warnings or errors." >> build-report.md
        continue-on-error: true # Allow report generation even if tests fail

      - name: Upload Build Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-report-${{ env.BUILD_VERSION }}
          path: build-report.md

      - name: Publish Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webapp-${{ env.BUILD_VERSION }}
          path: ${{ env.PUBLISH_DIR }}

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: [build-and-test]

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: webapp-${{ needs.build-and-test.outputs.build_version }}
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: '${{ env.AZURE_WEBAPP_PACKAGE_PATH }}'
